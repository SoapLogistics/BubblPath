name: Auto-merge Jules PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  automerge:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    # Only run if the PR was opened by the google-labs-jules bot
    if: github.actor == 'google-labs-jules[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --admin
