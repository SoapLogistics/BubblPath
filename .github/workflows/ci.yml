name: CI

on:
  push:
    branches: [ main, integration-v2, feature/inventory-and-verification ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Continuous Integration Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.1.7
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.12'
        cache: 'pip'
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest-cov

    - name: Run Formatting Check (Black)
      run: |
        black --check --line-length 120 . || echo "Formatting issues detected, please run 'scripts/solomon_dx.py format'"
        
    - name: Run Linting Check (Flake8)
      run: |
        flake8 --max-line-length=120 --exclude=.git,__pycache__,build,dist,venv,env . || echo "Linting issues found, please check."

    - name: Run Type Checking (Mypy)
      run: |
        mypy --ignore-missing-imports --no-strict-optional core/ services/ || echo "Type checking warnings found."

    - name: Run Pytest Suite with Coverage
      run: |
        PYTHONPATH=. pytest --cov=core --cov=services tests/
