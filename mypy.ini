[mypy]
# Global type checking strictness configuration
python_version = 3.12
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = True

# Disable strict optional by default to accommodate baseline components safely
strict_optional = False

# Skip typing check for generated capabilities and legacy modules
exclude = (?x)(
    venv/
    | env/
    | build/
    | dist/
    | gabriel_engine/assimilated_capabilities/
  )
