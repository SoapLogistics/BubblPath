<!DOCTYPE html>
<html>
<head>
    <title>Solomon Companion Options</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #3498db; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Solomon Configuration</h2>
    <div class="form-group">
        <label for="backend-url">Backend URL</label>
        <input type="text" id="backend-url" value="http://localhost:10000">
    </div>
    <div class="form-group">
        <label for="auth-key">Authorization Key</label>
        <input type="password" id="auth-key" placeholder="Enter SOLOMON_INTERNAL_AUTH_KEY">
    </div>
    <div style="display: flex; gap: 10px;">
        <button id="save-btn">Save</button>
        <button id="test-btn" style="background: #e67e22;">Test Connection</button>
    </div>
    <div id="status" style="margin-top: 10px; font-weight: bold;"></div>
    <script src="options.js"></script>
</body>
</html>
