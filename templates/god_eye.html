<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Eye 3D Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #0f0; font-family: monospace; }
        #hud { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0, 20, 0, 0.8); padding: 15px; border: 1px solid #0f0; border-radius: 5px; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5); max-width: 300px; }
        h1 { margin-top: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .stat { margin: 5px 0; font-size: 0.9rem; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="hud">
        <h1>God Eye Visualizer</h1>
        <div class="stat">Status: <span class="blink">ONLINE</span></div>
        <div class="stat">Nodes: <span id="nodeCount">0</span></div>
        <div class="stat">Edges: <span id="edgeCount">0</span></div>
        <div class="stat">Valence: <span id="valenceStatus">NEUTRAL</span></div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Three.js Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 800;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        const connectome = new THREE.Group();
        scene.add(connectome);

        // Pre-allocate large buffers to prevent GC churn (max 10,000 nodes, 50,000 edges)
        const MAX_NODES = 10000;
        const MAX_EDGES = 50000;

        const particlesGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(MAX_NODES * 3);
        const colors = new Float32Array(MAX_NODES * 3);

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        particlesGeometry.setDrawRange(0, 0);

        const linesGeometry = new THREE.BufferGeometry();
        const linePositions = new Float32Array(MAX_EDGES * 6); // 2 vertices per edge, 3 coords per vertex
        linesGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        linesGeometry.setDrawRange(0, 0);

        const pMaterial = new THREE.PointsMaterial({
            size: 8,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });

        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0.15
        });

        const particleSystem = new THREE.Points(particlesGeometry, pMaterial);
        const lines = new THREE.LineSegments(linesGeometry, lineMaterial);

        connectome.add(particleSystem);
        connectome.add(lines);

        function updateGraph(data) {
            const nodes = data.nodes || [];
            const edges = data.edges || [];
            
            const numNodes = Math.min(nodes.length, MAX_NODES);
            document.getElementById('nodeCount').innerText = numNodes;
            
            let redDominant = 0;
            let blueDominant = 0;

            const posAttr = particlesGeometry.attributes.position;
            const colAttr = particlesGeometry.attributes.color;

            // Update Nodes directly in existing buffer
            const nodeIndexMap = new Map(); // For resolving edge indices

            for (let i = 0; i < numNodes; i++) {
                const node = nodes[i];
                nodeIndexMap.set(node.idx, i); // Map raw matrix ID to buffer index

                posAttr.setXYZ(i, node.x, node.y, node.z);

                let r = 0, g = 1, b = 0;
                
                if (node.valence < -0.1) {
                    r = 1; g = 0; b = 0;
                    redDominant++;
                } else if (node.valence > 0.1) {
                    r = 0; g = 0.5; b = 1;
                    blueDominant++;
                } else {
                    if (Math.random() > 0.98) {
                        r = 0; g = 1; b = 0.5;
                    }
                }
                
                colAttr.setXYZ(i, r, g, b);
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
            particlesGeometry.setDrawRange(0, numNodes);

            // Update Edges safely from backend
            let lineIdx = 0;
            let drawCount = 0;
            const lineAttr = linesGeometry.attributes.position;

            for (let i = 0; i < edges.length && drawCount < MAX_EDGES; i++) {
                const edge = edges[i];
                const sourceBufIdx = nodeIndexMap.get(edge.source);
                const targetBufIdx = nodeIndexMap.get(edge.target);

                // Only draw if both nodes are currently rendered
                if (sourceBufIdx !== undefined && targetBufIdx !== undefined) {
                    const n1 = nodes[sourceBufIdx];
                    const n2 = nodes[targetBufIdx];

                    lineAttr.setXYZ(lineIdx++, n1.x, n1.y, n1.z);
                    lineAttr.setXYZ(lineIdx++, n2.x, n2.y, n2.z);
                    drawCount++;
                }
            }

            document.getElementById('edgeCount').innerText = drawCount;
            lineAttr.needsUpdate = true;
            linesGeometry.setDrawRange(0, drawCount * 2);

            // Update Valence Hud
            if (redDominant > blueDominant && redDominant > 0) {
                document.getElementById('valenceStatus').innerText = "NEGATIVE / AVERSIVE";
                document.getElementById('valenceStatus').style.color = "#ff0000";
            } else if (blueDominant > redDominant && blueDominant > 0) {
                document.getElementById('valenceStatus').innerText = "POSITIVE / REWARDING";
                document.getElementById('valenceStatus').style.color = "#0088ff";
            } else {
                document.getElementById('valenceStatus').innerText = "NEUTRAL";
                document.getElementById('valenceStatus').style.color = "#00ff00";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            connectome.rotation.y += 0.002;
            connectome.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Polling loop for actual memory graph
        setInterval(async () => {
            try {
                const response = await fetch('/api/memory/graph.json');
                if (response.ok) {
                    const data = await response.json();
                    updateGraph(data);
                }
            } catch (e) {
                console.error("Failed to fetch memory graph:", e);
            }
        }, 2000);

        fetch('/api/memory/graph.json')
            .then(res => res.json())
            .then(data => updateGraph(data))
            .catch(e => console.error(e));
    </script>
</body>
</html>
