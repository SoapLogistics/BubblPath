<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Eye 3D Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #c9d1d9;
            font-family: 'Outfit', sans-serif;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 15, 25, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 243, 255, 0.1);
            min-width: 250px;
        }

        h1 { 
            margin: 0 0 20px 0; 
            font-size: 1.4rem; 
            font-weight: 800;
            text-transform: uppercase; 
            letter-spacing: 2px; 
            background: linear-gradient(90deg, #00f3ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .stat-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .stat-label {
            color: #8b949e;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .stat-val {
            font-weight: 600;
            color: #fff;
        }

        .status-online {
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0,243,255,0.5);
        }

        .valence-neutral { color: #8b949e; }
        .valence-positive { color: #00f3ff; text-shadow: 0 0 10px rgba(0,243,255,0.6); }
        .valence-negative { color: #ff00ff; text-shadow: 0 0 10px rgba(255,0,255,0.6); }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00f3ff;
            margin-right: 8px;
            box-shadow: 0 0 8px #00f3ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 243, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }

        canvas { display: block; }
    </style>
</head>
<body>
    <div id="hud">
        <h1>God Eye 3D</h1>
        
        <div class="stat-group">
            <span class="stat-label">Telemetry</span>
            <span class="stat-val status-online"><span class="pulse-dot"></span>ACTIVE</span>
        </div>
        
        <div class="stat-group">
            <span class="stat-label">Neural Nodes</span>
            <span class="stat-val" id="nodeCount">0</span>
        </div>
        
        <div class="stat-group">
            <span class="stat-label">Synaptic Edges</span>
            <span class="stat-val" id="edgeCount">0</span>
        </div>
        
        <div class="stat-group" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
            <span class="stat-label">Valence State</span>
            <span class="stat-val valence-neutral" id="valenceStatus">NEUTRAL</span>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup Three.js Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0012);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505, 1);
        document.body.appendChild(renderer.domElement);

        // Connectome Data Structure
        const particles = new THREE.BufferGeometry();
        const maxNodes = 600;
        const positions = new Float32Array(maxNodes * 3);
        const colors = new Float32Array(maxNodes * 3);
        
        // Base Color: Cyan (0, 0.95, 1)
        const baseR = 0.0;
        const baseG = 0.95;
        const baseB = 1.0;

        function initNodes() {
            for(let i = 0; i < maxNodes; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 600;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 600;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 600;
                
                colors[i * 3] = baseR;     
                colors[i * 3 + 1] = baseG; 
                colors[i * 3 + 2] = baseB; 
            }
            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        }
        initNodes();

        const pMaterial = new THREE.PointsMaterial({
            size: 3.5,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9
        });

        const particleSystem = new THREE.Points(particles, pMaterial);
        scene.add(particleSystem);

        // Edges (Connections)
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x00f3ff,
            transparent: true,
            opacity: 0.1,
            blending: THREE.AdditiveBlending
        });

        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = new Float32Array(maxNodes * 6);
        let edgeCount = 0;

        function updateEdges() {
            let lineIndex = 0;
            edgeCount = 0;
            const posAttr = particles.getAttribute('position');
            
            for(let i = 0; i < maxNodes; i++) {
                for(let j = i + 1; j < maxNodes; j++) {
                    const dx = posAttr.getX(i) - posAttr.getX(j);
                    const dy = posAttr.getY(i) - posAttr.getY(j);
                    const dz = posAttr.getZ(i) - posAttr.getZ(j);
                    const distSq = dx*dx + dy*dy + dz*dz;
                    
                    if(distSq < 12000) {
                        linePositions[lineIndex++] = posAttr.getX(i);
                        linePositions[lineIndex++] = posAttr.getY(i);
                        linePositions[lineIndex++] = posAttr.getZ(i);
                        
                        linePositions[lineIndex++] = posAttr.getX(j);
                        linePositions[lineIndex++] = posAttr.getY(j);
                        linePositions[lineIndex++] = posAttr.getZ(j);
                        edgeCount++;
                    }
                }
            }
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions.slice(0, lineIndex), 3));
            lineGeometry.attributes.position.needsUpdate = true;
            
            document.getElementById('nodeCount').innerText = maxNodes.toLocaleString();
            document.getElementById('edgeCount').innerText = edgeCount.toLocaleString();
        }

        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lines);
        updateEdges();

        // Animation Loop
        let frame = 0;
        function animate() {
            requestAnimationFrame(animate);

            particleSystem.rotation.y += 0.001;
            particleSystem.rotation.x += 0.0005;
            lines.rotation.y += 0.001;
            lines.rotation.x += 0.0005;

            // Simulate synaptic firing and valance changes
            frame++;
            if (frame % 30 === 0) {
                const colorAttr = particles.getAttribute('color');
                let magentaDominant = 0;
                let cyanDominant = 0;
                
                for(let i = 0; i < maxNodes; i++) {
                    if (Math.random() > 0.94) {
                        // Flash Magenta (1, 0, 1) or keep Cyan
                        const isMagenta = Math.random() > 0.5;
                        if (isMagenta) {
                            colorAttr.setXYZ(i, 1.0, 0.0, 1.0);
                            magentaDominant++;
                        } else {
                            colorAttr.setXYZ(i, 0.0, 0.95, 1.0);
                            cyanDominant++;
                        }
                    } else {
                        // Fade back to baseline cyan smoothly
                        const r = Math.max(baseR, colorAttr.getX(i) - 0.05);
                        const g = Math.min(baseG, colorAttr.getY(i) + 0.05);
                        const b = Math.min(baseB, colorAttr.getZ(i) + 0.05);
                        colorAttr.setXYZ(i, r, g, b);
                    }
                }
                colorAttr.needsUpdate = true;
                
                const valEl = document.getElementById('valenceStatus');
                if (magentaDominant > cyanDominant + 5) {
                    valEl.innerText = "NEGATIVE / AVERSIVE";
                    valEl.className = "stat-val valence-negative";
                } else if (cyanDominant > magentaDominant + 5) {
                    valEl.innerText = "POSITIVE / REWARDING";
                    valEl.className = "stat-val valence-positive";
                } else {
                    valEl.innerText = "NEUTRAL";
                    valEl.className = "stat-val valence-neutral";
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
