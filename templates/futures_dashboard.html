<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures 90+ Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(20, 25, 35, 0.6);
            --border-glow: rgba(88, 166, 255, 0.2);
            --accent-blue: #58a6ff;
            --accent-pink: #ff7b72;
            --accent-green: #3fb950;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1a2035, var(--bg-dark));
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .glass-panel:hover {
            border-color: var(--border-glow);
            box-shadow: 0 8px 32px rgba(88,166,255,0.1);
        }

        .top-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(88,166,255,0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            padding: 15px;
            color: var(--text-muted);
            font-weight: 400;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: 300;
        }

        tr {
            transition: background 0.2s ease;
        }

        tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .val-90 {
            color: var(--accent-blue);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(88,166,255,0.4);
        }
        
        .val-failed {
            color: var(--accent-pink);
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent-blue);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }
        .pulse { animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Solomon Loki Engine</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="uiStateIndicator" style="color: var(--text-muted); font-size: 0.9rem;">INITIALIZING</span>
                <button id="refreshBtn">Sync Engine</button>
            </div>
        </div>

        <div class="top-stats glass-panel">
            <div class="stat-card">
                <div class="stat-value pulse" id="svcStatus" style="color: var(--accent-green)">ONLINE</div>
                <div class="stat-label">Neural Link</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="signalCount">0</div>
                <div class="stat-label">Active Signals</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lastUpdate" style="color: var(--text-main); font-size: 1.4rem; padding-top: 5px;">--:--:--</div>
                <div class="stat-label">Last Synchronization</div>
            </div>
        </div>

        <div id="loadingState" class="glass-panel" style="text-align: center; padding: 40px;">
            <div class="loading-spinner"></div>
            <p style="color: var(--text-muted); margin-top: 15px;">Interrogating Futures Simulation...</p>
        </div>

        <div id="errorState" class="glass-panel hidden" style="border-color: var(--accent-pink);">
            <h3 style="color: var(--accent-pink); margin-top:0;">Telemetry Error</h3>
            <p id="errorMsg" style="color: var(--text-muted);"></p>
        </div>

        <div id="dataContainer" class="glass-panel hidden">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Candidate UUID</th>
                        <th>Probability State</th>
                        <th>Engine Mode</th>
                        <th>Simulated Odds</th>
                        <th>Confidence Bound</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const uiState = document.getElementById('uiStateIndicator');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const dataContainer = document.getElementById('dataContainer');
        const tbody = document.querySelector('#resultsTable tbody');

        function setState(state, msg = '') {
            uiState.textContent = state;
            loadingState.classList.add('hidden');
            errorState.classList.add('hidden');
            dataContainer.classList.add('hidden');

            if (state === 'LOADING') loadingState.classList.remove('hidden');
            if (state === 'ERROR') {
                errorState.classList.remove('hidden');
                document.getElementById('errorMsg').textContent = msg;
            }
            if (state === 'READY') {
                dataContainer.classList.remove('hidden');
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function fetchDashboard() {
            setState('LOADING');
            try {
                const res = await fetch('/api/futures/dashboard');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.status === 'error') {
                    setState('ERROR', data.message);
                    return;
                }

                document.getElementById('svcStatus').textContent = data.service_status || 'ONLINE';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

                tbody.innerHTML = '';
                
                if (!data.projections || data.projections.length === 0) {
                    setState('READY');
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 5;
                    td.textContent = 'No active futures projections found.';
                    td.style.textAlign = 'center';
                    td.style.color = 'var(--text-muted)';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    document.getElementById('signalCount').textContent = "0";
                    return;
                }

                document.getElementById('signalCount').textContent = data.projections.length.toString();

                data.projections.forEach(proj => {
                    const tr = document.createElement('tr');
                    let statusClass = '';
                    if (proj.status === 'CONFIRMED_90_PLUS') statusClass = 'val-90';
                    else if (proj.status.includes('FAILED')) statusClass = 'val-failed';

                    const cells = [
                        `<span style="font-family: monospace; color: var(--text-muted);">${escapeHtml(proj.candidate_id)}</span>`,
                        `<span class="${statusClass}">${escapeHtml(proj.status)}</span>`,
                        `<span style="padding: 4px 8px; background: rgba(255,255,255,0.05); border-radius: 4px; font-size: 0.8rem;">${escapeHtml(proj.source_mode)}</span>`,
                        proj.simulation_probability ? `<span style="color: var(--text-main); font-weight: 500;">${(proj.simulation_probability * 100).toFixed(1)}%</span>` : '--',
                        proj.interval_lower ? `<span style="color: var(--text-muted);">${(proj.interval_lower * 100).toFixed(1)}%</span>` : '--'
                    ];

                    cells.forEach((htmlContent) => {
                        const td = document.createElement('td');
                        td.innerHTML = htmlContent;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                setState('READY');
            } catch (err) {
                setState('ERROR', err.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchDashboard);
        fetchDashboard();
    </script>
</body>
</html>
