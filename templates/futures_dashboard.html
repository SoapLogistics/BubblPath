<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures 90+ Analysis Dashboard</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #0f0;
            --border-color: #0f0;
            --alert-red: #ff0000;
            --alert-blue: #0088ff;
            --dim-color: #004400;
        }
        @media (prefers-reduced-motion: reduce) {
            .blink { animation: none !important; opacity: 1 !important; }
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: monospace;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 15px;
            background: rgba(0, 20, 0, 0.9);
        }
        h1 { margin-top: 0; font-size: 1.4rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .controls { margin-bottom: 15px; display: flex; justify-content: space-between; }
        button { background: var(--dim-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; cursor: pointer; }
        button:hover { background: #006600; }

        .status-panel { margin-bottom: 15px; padding: 10px; border: 1px dashed var(--border-color); }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--border-color); padding: 8px; text-align: left; }
        th { background-color: var(--dim-color); }

        .state-loading, .state-error, .state-stale { display: none; padding: 15px; text-align: center; border: 1px solid; margin-bottom: 15px;}
        .state-error { border-color: var(--alert-red); color: var(--alert-red); }
        .state-stale { border-color: #ffaa00; color: #ffaa00; }

        .val-90 { color: var(--alert-blue); font-weight: bold; }
        .val-not-90 { color: #888; }
        .val-failed { color: var(--alert-red); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Solomon Loki: 90+ Futures</h1>

        <div class="controls">
            <div>
                <strong>UI State: </strong> <span id="uiStateIndicator">INITIALIZING</span>
            </div>
            <button id="refreshBtn">Refresh Data</button>
        </div>

        <div id="loadingState" class="state-loading" style="display:block;">LOADING DATA...</div>
        <div id="errorState" class="state-error">BACKEND_ERROR: <span id="errorMsg"></span></div>
        <div id="staleState" class="state-stale">WARNING: DATA IS STALE</div>

        <div id="dataContainer" style="display:none;">
            <div class="status-panel">
                <div>Service: <span id="svcStatus" class="blink">UNKNOWN</span></div>
                <div>Last Update: <span id="lastUpdate">Never</span></div>
            </div>

            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Pick</th>
                        <th>Market</th>
                        <th>Live Odds</th>
                        <th>Status</th>
                        <th>Probability (95% CI)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const uiState = document.getElementById('uiStateIndicator');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const staleState = document.getElementById('staleState');
        const dataContainer = document.getElementById('dataContainer');
        const tbody = document.querySelector('#resultsTable tbody');

        function setState(state, msg = '') {
            uiState.textContent = state;
            loadingState.style.display = 'none';
            errorState.style.display = 'none';
            staleState.style.display = 'none';
            dataContainer.style.display = 'none';

            if (state === 'LOADING') loadingState.style.display = 'block';
            if (state === 'BACKEND_ERROR') {
                errorState.style.display = 'block';
                document.getElementById('errorMsg').textContent = msg;
            }
            if (state === 'READY_WITH_RESULTS' || state === 'READY_EMPTY') {
                dataContainer.style.display = 'block';
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        async function fetchDashboard() {
            setState('LOADING');
            try {
                const res = await fetch('/api/futures/dashboard');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.status === 'error') {
                    setState('BACKEND_ERROR', data.message);
                    return;
                }

                document.getElementById('svcStatus').textContent = data.service_status || 'ONLINE';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

                tbody.innerHTML = ''; // Clear table
                if (!data.projections || data.projections.length === 0) {
                    setState('READY_EMPTY');
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 5;
                    td.textContent = 'NO RECENT RUNS';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }

                data.projections.forEach(proj => {
                    const tr = document.createElement('tr');

                    let statusClass = 'val-not-90';
                    if (proj.status === 'CONFIRMED_90_PLUS') statusClass = 'val-90';
                    else if (proj.status.includes('FAILED')) statusClass = 'val-failed';

                    // Securely construct cells
                    const cells = [
                        escapeHtml(proj.event_name),
                        escapeHtml(proj.pick),
                        escapeHtml(proj.market),
                        escapeHtml(proj.live_odds),
                        `<span class="${statusClass}">${escapeHtml(proj.status)}</span>`,
                        proj.simulation_probability ? `${(proj.simulation_probability * 100).toFixed(2)}% (≥${(proj.interval_lower * 100).toFixed(2)}%)` : 'N/A'
                    ];

                    cells.forEach((htmlContent, i) => {
                        const td = document.createElement('td');
                        if (i === 4) td.innerHTML = htmlContent; // Safe because statusClass/escapeHtml ensures integrity
                        else td.textContent = htmlContent;
                        tr.appendChild(td);
                    });

                    tbody.appendChild(tr);
                });

                setState('READY_WITH_RESULTS');
            } catch (err) {
                setState('BACKEND_ERROR', err.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchDashboard);
        fetchDashboard();
    </script>
</body>
</html>
