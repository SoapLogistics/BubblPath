<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solomon Native Interface</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: #161b22;
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: #3fb950;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #3fb950;
        }
        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user-message {
            align-self: flex-end;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .solomon-message {
            align-self: flex-start;
            background-color: #0d1117;
            border-left: 3px solid #58a6ff;
            color: #8b949e;
        }
        .solomon-message strong {
            color: #58a6ff;
        }
        .input-container {
            padding: 20px;
            background-color: #161b22;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Solomon Native Core</h1>
        <div class="status-indicator">
            <div class="status-dot"></div>
            Hyper-Quantized Brain Online
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message solomon-message">
            <strong>[SYSTEM]</strong> Connection established to local synthesizer.<br>What are your coordinates?
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Enter command sequence..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">TRANSMIT</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        function appendMessage(sender, text, isSolomon = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isSolomon ? 'solomon-message' : 'user-message'}`;
            
            if (isSolomon) {
                msgDiv.innerHTML = `<strong>[SOLOMON]</strong><br>${text}`;
            } else {
                msgDiv.innerHTML = `<strong>[USER]</strong><br>${text}`;
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('USER', text, false);
            userInput.value = '';
            userInput.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                appendMessage('SOLOMON', data.reply, true);
                
                // Also log the raw internal state to the browser console for debugging
                console.log("RAW SYSTEM STATE:\\n", data.native_state);
                
            } catch (err) {
                appendMessage('SYSTEM', `[ERROR] Connection to core severed: ${err.message}`, true);
            } finally {
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
