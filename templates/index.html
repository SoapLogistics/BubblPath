<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 min-h-screen relative">

    <!-- Mobile App Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">

        <!-- Top Navigation Bar -->
        <header class="flex justify-between items-center px-4 py-4 bg-white shadow-sm">
            <button class="text-gray-600 focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <h1 class="text-lg font-semibold">My Classes</h1>
            <button class="text-gray-600 focus:outline-none">
                <i class="fas fa-user-circle text-xl"></i>
            </button>
        </header>

        <!-- Tab Menu -->
        <nav class="flex border-b border-gray-200">
            <button class="flex-1 py-3 text-center border-b-2 border-indigo-500 text-indigo-600 font-medium focus:outline-none">
                Classes
            </button>
            <button class="flex-1 py-3 text-center text-gray-500 font-medium hover:text-gray-700 focus:outline-none">
                Instructors
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="p-4 space-y-4">

            <!-- Class Card -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                <div class="h-40 bg-gray-300 relative">
                    <!-- Image Placeholder -->
                    <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Yoga Class" class="w-full h-full object-cover">

                    <!-- Overlay Badge -->
                    <div class="absolute top-2 left-2 bg-white bg-opacity-90 px-2 py-1 rounded text-xs font-semibold text-gray-700">
                        Live
                    </div>
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-bold mb-1">Yoga for Beginners</h2>
                    <p class="text-sm text-gray-500 mb-3">Instructor: Jane Doe</p>

                    <div class="flex items-center space-x-4 text-sm text-gray-600">
                        <div class="flex items-center">
                            <i class="far fa-clock mr-1"></i> 45 min
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-signal mr-1"></i> Beginner
                        </div>
                    </div>
                </div>
            </div>

            <!-- Additional Placeholder Card -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                <div class="h-40 bg-gray-300 relative">
                    <img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Fitness Class" class="w-full h-full object-cover">
                </div>
                <div class="p-4">
                    <h2 class="text-xl font-bold mb-1">HIIT Cardio</h2>
                    <p class="text-sm text-gray-500 mb-3">Instructor: John Smith</p>

                    <div class="flex items-center space-x-4 text-sm text-gray-600">
                        <div class="flex items-center">
                            <i class="far fa-clock mr-1"></i> 30 min
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-signal mr-1"></i> Advanced
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Floating Action Button (FAB) -->
        <button class="absolute bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition duration-300">
            <i class="fas fa-plus text-2xl"></i>
        </button>

    </div>

</body>
</html>
