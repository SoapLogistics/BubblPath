version: '3.8'

services:
  solomon-api:
    build: .
    ports:
      - "10000:10000"
    volumes:
      - ./solomon_mnemosyne.db:/app/solomon_mnemosyne.db
      - ./openclaw-workspace:/app/openclaw-workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SOLOMON_DB_PATH=/app/solomon_mnemosyne.db
    restart: always

  solomon-worker:
    build: .
    command: ["python3", "-m", "solomon_heartbeat"]
    volumes:
      - ./solomon_mnemosyne.db:/app/solomon_mnemosyne.db
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SOLOMON_DB_PATH=/app/solomon_mnemosyne.db
    restart: always
