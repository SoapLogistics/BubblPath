<!DOCTYPE html>
<html>
<head>
  <title>Solomon</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      background-color: #f9f9f9;
    }
    #context-banner {
      background-color: #e3f2fd;
      border: 1px solid #90caf9;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #1565c0;
      display: none;
    }
    #chat-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: white;
    }
    .message {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      line-height: 1.4;
    }
    .user-message {
      background-color: #e0f7fa;
      text-align: right;
      margin-left: 20px;
    }
    .solomon-message {
      background-color: #f1f8e9;
      text-align: left;
      margin-right: 20px;
    }
    #input-container {
      display: flex;
    }
    #chat-input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 5px;
    }
    button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    /* Add pending action styles */
    #pending-action-container {
      display: none;
      background-color: #fff3e0;
      border: 1px solid #ffb74d;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      text-align: center;
    }
    #pending-action-container p {
      margin-top: 0;
      font-size: 13px;
      color: #e65100;
      font-weight: bold;
    }
    .action-btn {
      padding: 6px 12px;
      margin: 0 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #approve-btn {
      background-color: #4caf50;
      color: white;
    }
    #approve-btn:hover { background-color: #388e3c; }
    #cancel-btn {
      background-color: #f44336;
      color: white;
    }
    #cancel-btn:hover { background-color: #d32f2f; }
  </style>
</head>
<body>

  <div id="context-banner">👀 Context: None</div>
  <div id="chat-container"></div>

  <div id="pending-action-container">
    <p>⚠️ Manual Approval Required for Action</p>
    <div id="pending-action-details" style="font-size: 11px; margin-bottom: 8px; color: #555;"></div>
    <button id="approve-btn" class="action-btn">Approve</button>
    <button id="cancel-btn" class="action-btn">Cancel</button>
  </div>

  <div id="input-container">
    <input type="text" id="chat-input" placeholder="Ask Solomon..." />
    <button id="send-btn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
