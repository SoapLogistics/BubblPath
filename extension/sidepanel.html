<!DOCTYPE html>
<html>
<head>
  <title>Solomon</title>
  <style>
    /* Header & Tools */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header-bar h2 {
      margin: 0;
      font-size: 16px;
      color: #333;
    }
    .btn-group {
      display: flex;
      gap: 5px;
    }
    .tool-btn {
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f1f1f1;
      border-radius: 4px;
    }
    .halt-btn {
      background-color: #d32f2f;
      color: white;
      border-color: #b71c1c;
      font-weight: bold;
    }
    .halt-btn:hover { background-color: #c62828; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      background-color: #f9f9f9;
    }
    #context-banner {
      background-color: #e3f2fd;
      border: 1px solid #90caf9;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #1565c0;
      display: none;
      transition: background-color 0.3s;
    }
    .context-pulse {
      background-color: #bbdefb !important;
    }
    #chat-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: white;
    }
    .message {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      line-height: 1.4;
      position: relative;
    }
    .user-message {
      background-color: #e0f7fa;
      text-align: right;
      margin-left: 20px;
    }
    .solomon-message {
      background-color: #f1f8e9;
      text-align: left;
      margin-right: 20px;
    }
    .msg-time {
      font-size: 9px;
      color: #999;
      display: block;
      margin-top: 4px;
    }
    /* Typing indicator */
    .typing {
      font-style: italic;
      color: #666;
    }
    #input-container {
      display: flex;
      align-items: flex-end;
    }
    #chat-input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 5px;
      resize: none;
      min-height: 20px;
      max-height: 120px;
      font-family: inherit;
    }
    button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    /* Add pending action styles */
    #pending-action-container {
      display: none;
      background-color: #fff3e0;
      border: 1px solid #ffb74d;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      text-align: center;
    }
    #pending-action-container p {
      margin-top: 0;
      font-size: 13px;
      color: #e65100;
      font-weight: bold;
    }
    .action-btn {
      padding: 6px 12px;
      margin: 0 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #approve-btn {
      background-color: #4caf50;
      color: white;
    }
    #approve-btn:hover { background-color: #388e3c; }
    #cancel-btn {
      background-color: #f44336;
      color: white;
    }
    #cancel-btn:hover { background-color: #d32f2f; }

    /* Solomon-Jules Bridge Observer UI */
    #jules-bridge-container {
      display: none;
      background-color: #f1f8e9;
      border: 1px solid #c5e1a5;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      color: #33691e;
      font-family: monospace;
      position: relative;
    }
    #jules-close-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      cursor: pointer;
      font-weight: bold;
      color: #7cb342;
      border: none;
      background: none;
    }
    .jules-header {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }
    .jules-task-id {
      font-size: 11px;
      text-align: center;
      color: #558b2f;
      margin-bottom: 5px;
    }
    .jules-status {
      font-size: 11px;
      padding: 5px;
      background: #fff;
      border: 1px dashed #c5e1a5;
      text-align: center;
    }
    #jules-approve-btn {
      display: none;
      margin-top: 10px;
      width: 100%;
      background-color: #4caf50;
      color: white;
      padding: 6px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #jules-approve-btn:hover { background-color: #388e3c; }

    /* Project Nexus Jules Dashboard (Legacy) */
    #nexus-container {
      display: none;
      background-color: #1a1a2e;
      border: 1px solid #4a4e69;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      color: #e9ecef;
      font-family: monospace;
    }
    .nexus-header {
      font-size: 14px;
      color: #00f2fe;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
    }
    .nexus-steps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    .nexus-step {
      opacity: 0.4;
      text-align: center;
      flex: 1;
    }
    .nexus-step.active {
      opacity: 1;
      color: #4facfe;
    }
    .nexus-step.pulsing {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { text-shadow: 0 0 2px #4facfe; }
      50% { text-shadow: 0 0 10px #4facfe, 0 0 20px #00f2fe; color: #fff; }
      100% { text-shadow: 0 0 2px #4facfe; }
    }
    #nexus-log {
      margin-top: 10px;
      font-size: 10px;
      color: #a9a9a9;
      border-top: 1px dashed #4a4e69;
      padding-top: 5px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Solomon</h2>
    <div class="btn-group">
      <button id="clear-btn" class="tool-btn">🗑️ Clear</button>
      <button id="halt-btn" class="tool-btn halt-btn">🛑 HALT</button>
    </div>
  </div>

  <div id="context-banner">👀 Context: None</div>
  <div id="chat-container"></div>

  <div id="pending-action-container">
    <p>⚠️ Manual Approval Required for Action</p>
    <div id="pending-action-details" style="font-size: 11px; margin-bottom: 8px; color: #555;"></div>
    <button id="approve-btn" class="action-btn">Approve</button>
    <button id="cancel-btn" class="action-btn">Cancel</button>
  </div>

  <div id="jules-bridge-container">
    <button id="jules-close-btn">✖</button>
    <div class="jules-header">🤖 Jules API Observer</div>
    <div class="jules-task-id" id="jules-active-task">No Active Task</div>
    <div class="jules-status" id="jules-active-status">Waiting for telemetry...</div>
    <button id="jules-approve-btn">Approve Merge to SS1</button>
  </div>

  <div id="input-container">
    <textarea id="chat-input" placeholder="Ask Solomon... (Shift+Enter for newline)" rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
