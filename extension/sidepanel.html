<!DOCTYPE html>
<html>
<head>
  <title>Solomon</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      background-color: #f9f9f9;
    }
    #context-banner {
      background-color: #e3f2fd;
      border: 1px solid #90caf9;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #1565c0;
      display: none;
    }
    #chat-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      background-color: white;
    }
    .message {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      line-height: 1.4;
    }
    .user-message {
      background-color: #e0f7fa;
      text-align: right;
      margin-left: 20px;
    }
    .solomon-message {
      background-color: #f1f8e9;
      text-align: left;
      margin-right: 20px;
    }
    #input-container {
      display: flex;
    }
    #chat-input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 5px;
    }
    button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="context-banner">👀 Context: None</div>
  <div id="chat-container"></div>
  <div id="input-container">
    <input type="text" id="chat-input" placeholder="Ask Solomon..." />
    <button id="send-btn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
